name: CI

# Runs on every pull request and on every push, so broken code is caught before it reaches main.
on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable database for the test suite; the suite creates and drops its own schema.
      TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: Next.js generates route and layout types (e.g. LayoutProps) during the build,
      # and the type check needs them.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: System tests (disposable PostgreSQL)
        run: npm test
